[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D104", "D105", "D107"]

[tool.ruff.per-file-ignores]
"tests/*" = ["D"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
